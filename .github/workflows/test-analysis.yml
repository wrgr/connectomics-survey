name: Test post-processing analysis tools

on:
  pull_request:
    paths:
      - 'analysis/**'
      - 'docs/IA-004-provenance-and-author-reconciliation.md'
      - 'docs/IA-005-proximity-aware-role-triage.md'
      - 'docs/IA-006-discovered-role-bridge-recovery.md'
      - 'docs/IA-007-llm-first-semantic-screening.md'
      - 'docs/POSTANALYSIS_PAPER_FLOW.md'
      - '.github/workflows/test-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install pandas matplotlib networkx
      - name: Compile analysis scripts
        run: >-
          python -m py_compile
          analysis/postprocess_run.py
          analysis/reconcile_cleanup.py
          analysis/prepare_person_review.py
          analysis/apply_person_aliases.py
          analysis/triage_people.py
          analysis/triage_paper_categories.py
          analysis/consolidate_role_bridges.py
          analysis/build_paper_accounting.py
          analysis/llm_relevance_screen.py
      - name: Run deterministic helper checks
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          reconcile = load('reconcile', Path('analysis/reconcile_cleanup.py'))
          aliases = load('aliases', Path('analysis/apply_person_aliases.py'))
          triage = load('triage', Path('analysis/triage_paper_categories.py'))
          consolidate = load('consolidate', Path('analysis/consolidate_role_bridges.py'))
          llm = load('llm', Path('analysis/llm_relevance_screen.py'))

          assert reconcile.norm_name('A. McIntosh') == 'a mcintosh'
          assert reconcile.norm_name_ignore_middle_initials('William R. Gray-Roncal') == 'william gray roncal'
          assert reconcile.split_set('network_science; qc ;network_science') == {'network_science', 'qc'}

          uf = aliases.UnionFind(['9', '2', '5'])
          uf.union('9', '5')
          uf.union('5', '2')
          assert uf.find('9') == '2'
          assert uf.find('5') == '2'

          assert triage.RECOVERY_MIN_DIRECT['training_outreach'] == 1
          assert triage.RECOVERY_MIN_DIRECT['health'] == 2
          assert consolidate.ROLE_RULES['training_outreach']['min_direct'] == 1
          assert consolidate.ROLE_RULES['health']['min_direct'] == 2

          assert llm.PROMPT_VERSION == 'IA-007-v1'
          assert 'out_of_scope' in llm.ALLOWED_DECISIONS
          assert 'training_outreach' in llm.ALLOWED_ROLES
          demo = llm.build_prompt({'title': 'Demo', 'abstract': 'A connectome paper.'}, 'unresolved')
          assert 'uncertain rather than out_of_scope' in demo
          print('analysis helper checks passed')
          PY
