name: Test post-processing analysis tools

on:
  pull_request:
    paths:
      - 'analysis/**'
      - 'docs/IA-004-provenance-and-author-reconciliation.md'
      - 'docs/IA-005-proximity-aware-role-triage.md'
      - 'docs/IA-006-discovered-role-bridge-recovery.md'
      - 'docs/IA-007-llm-first-semantic-screening.md'
      - 'docs/IA-008-work-reconciliation-and-abstract-rescue.md'
      - 'docs/IA-009-agent-offline-adjudication.md'
      - 'docs/IA-010-record-type-triage.md'
      - 'docs/POSTANALYSIS_PAPER_FLOW.md'
      - '.github/workflows/test-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install pandas matplotlib networkx
      - name: Compile analysis scripts
        run: >-
          python -m py_compile
          analysis/postprocess_run.py
          analysis/reconcile_cleanup.py
          analysis/prepare_person_review.py
          analysis/apply_person_aliases.py
          analysis/triage_people.py
          analysis/triage_paper_categories.py
          analysis/consolidate_role_bridges.py
          analysis/build_paper_accounting.py
          analysis/reconcile_paper_works.py
          analysis/rescue_missing_abstracts.py
          analysis/llm_relevance_screen.py
          analysis/watch_progress.py
          analysis/compare_screening_runs.py
          analysis/triage_record_types.py
          analysis/apply_record_type_partition.py
          analysis/test_llm_relevance_screen.py
          analysis/test_compare_screening_runs.py
          analysis/test_triage_record_types.py
          analysis/collect_corpus_pdfs.py
          analysis/test_collect_corpus_pdfs.py
          analysis/collect_pmc_browser_pdfs.py
          analysis/build_v3_authorship_viz.py
          analysis/human_review.py
          analysis/test_human_review.py
          analysis/analyze_citation_roles.py
          analysis/build_corpus_graph_views.py
      - name: Human-review overlay checks
        run: python analysis/test_human_review.py
      - name: Screening-run comparison checks
        run: python analysis/test_compare_screening_runs.py
      - name: Offline adjudication checks
        run: python analysis/test_llm_relevance_screen.py
      - name: Record-type triage checks
        run: python analysis/test_triage_record_types.py
      - name: Corpus PDF collection checks
        run: python analysis/test_collect_corpus_pdfs.py
      - name: Run deterministic helper checks
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          import pandas as pd

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          postprocess = load('postprocess', Path('analysis/postprocess_run.py'))
          reconcile = load('reconcile', Path('analysis/reconcile_cleanup.py'))
          aliases = load('aliases', Path('analysis/apply_person_aliases.py'))
          triage = load('triage', Path('analysis/triage_paper_categories.py'))
          consolidate = load('consolidate', Path('analysis/consolidate_role_bridges.py'))
          works = load('works', Path('analysis/reconcile_paper_works.py'))
          rescue = load('rescue', Path('analysis/rescue_missing_abstracts.py'))
          llm = load('llm', Path('analysis/llm_relevance_screen.py'))
          watch = load('watch', Path('analysis/watch_progress.py'))

          def run_main(module, argv):
              old = sys.argv
              sys.argv = argv
              try:
                  module.main()
              finally:
                  sys.argv = old

          assert reconcile.norm_name('A. McIntosh') == 'a mcintosh'
          assert reconcile.norm_name_ignore_middle_initials('William R. Gray-Roncal') == 'william gray roncal'
          assert reconcile.split_set('network_science; qc ;network_science') == {'network_science', 'qc'}
          assert reconcile.classify_person_pair(
              shared=10, co_j=0.9, year_overlap=True, direct_same_name_coauthor=True
          ) == 'same_name_coauthor_collision'

          uf = aliases.UnionFind(['9', '2', '5'])
          uf.union('9', '5')
          uf.union('5', '2')
          assert uf.find('9') == '2'
          assert uf.find('5') == '2'

          # Explicit separation must override an otherwise transitive merge plan by
          # making the reviewed decision set invalid rather than silently merging it.
          contradiction = pd.DataFrame([{'author_id_a':'9', 'author_id_b':'2', 'decision':'separate'}])
          try:
              aliases.validate_separate_constraints(uf, contradiction, {'9','2','5'})
          except RuntimeError as exc:
              assert 'contradictory' in str(exc)
          else:
              raise AssertionError('expected contradictory separate/merge decisions to fail')

          # Optional bridge/enrichment outputs may be valid zero-byte CSVs.
          with tempfile.TemporaryDirectory() as td:
              empty = Path(td) / 'health_bridge.csv'
              empty.write_bytes(b'')
              empty_df = postprocess.read_optional_csv(empty, ['health_terms'])
              assert empty_df.empty
              assert list(empty_df.columns) == ['health_terms']

          assert triage.RECOVERY_MIN_DIRECT['training_outreach'] == 1
          assert triage.RECOVERY_MIN_DIRECT['health'] == 2
          assert consolidate.ROLE_RULES['training_outreach']['min_direct'] == 1
          assert consolidate.ROLE_RULES['health']['min_direct'] == 2

          assert works.norm_doi('https://doi.org/10.1101/ABC') == '10.1101/abc'
          assert works.norm_text('CAVE: Connectome Annotation') == 'cave connectome annotation'
          assert works.is_preprint({'doi':'10.1101/2023.01.01.1'})
          assert rescue.openalex_abstract({'hello':[0], 'world':[1]}) == 'hello world'

          assert llm.PROMPT_VERSION == 'IA-007-v2-work-level'
          assert 'out_of_scope' in llm.ALLOWED_DECISIONS
          assert 'training_outreach' in llm.ALLOWED_ROLES
          demo = llm.build_prompt({'source_group':'unresolved','title':'Demo','abstract':'A connectome paper.'})
          assert 'uncertain rather than out_of_scope' in demo

          # IA-009 keeps one prompt version across execution paths, so agent and API cache
          # entries must separate on run_mode and model rather than on the prompt text.
          assert llm.CACHE_SCHEMA == 'ia007-cache-v2'
          agent_id = 'agent:cursor/claude-opus-5-thinking'
          demo_sha = llm.sha256_text(demo)
          assert llm.cache_key('w1', demo_sha, agent_id, 'agent_offline') != llm.cache_key('w1', demo_sha, agent_id, 'api')
          assert llm.cache_key('w1', demo_sha, agent_id, 'agent_offline') != llm.stable_hash(
              {'work_id':'w1', 'prompt':demo, 'model':agent_id, 'version':llm.PROMPT_VERSION}
          )
          assert llm.ADJUDICATOR_RE.match(agent_id) and not llm.ADJUDICATOR_RE.match('gpt-5.6')
          assert llm.criteria_sha256() == llm.sha256_text(llm.SYSTEM + '\n\n' + llm.CRITERIA)

          # Progress records must name the rescue outcome and only carry abstract text
          # for network sources, which is what makes a rerun resumable.
          missing_rec = rescue.progress_record(1, 10, {'work_id':'w','canonical_paper_id':'p','title':'T'}, 'missing', '', '', True, [])
          assert missing_rec['rescue_source'] == 'still_missing'
          assert missing_rec['abstract'] == '' and missing_rec['abstract_chars'] == 0
          hit_rec = rescue.progress_record(2, 10, {'work_id':'w','canonical_paper_id':'p','title':'T'}, 'crossref', '10.1/x', 'abc', True, ['crossref:hit'])
          assert hit_rec['abstract'] == 'abc' and hit_rec['abstract_chars'] == 3
          assert hit_rec['attempts'] == ['crossref:hit'] and hit_rec['total'] == 10

          # Malformed lines are skipped and the last record for a work wins.
          with tempfile.TemporaryDirectory() as td:
              dup = Path(td) / 'dup.jsonl'
              dup.write_text('\n'.join([
                  json.dumps({'work_id':'w', 'rescue_source':'still_missing'}),
                  'not json at all',
                  json.dumps({'work_id':'w', 'rescue_source':'crossref', 'abstract':'x'}),
              ]) + '\n')
              assert rescue.read_progress(dup)['w']['rescue_source'] == 'crossref'

          # Abstract rescue streams one record per canonical work and reuses a
          # previously rescued abstract without touching the network. Works below
          # carry no DOI/PMID, so no rescue backend is reachable.
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              works_csv = root / 'canonical_works.csv'
              versions_csv = root / 'work_versions.csv'
              pd.DataFrame([
                  {'work_id':'work_a','canonical_paper_id':'p1','source_group':'core_audit','title':'Has abstract','abstract':'An existing abstract.','doi':''},
                  {'work_id':'work_b','canonical_paper_id':'p2','source_group':'unresolved','title':'Needs rescue','abstract':'','doi':''},
                  {'work_id':'work_c','canonical_paper_id':'p3','source_group':'role_bridge','title':'Also needs rescue','abstract':'','doi':''},
              ]).to_csv(works_csv, index=False)
              pd.DataFrame([
                  {'work_id':'work_a','paper_id':'p1','pmid':''},
                  {'work_id':'work_b','paper_id':'p2','pmid':''},
                  {'work_id':'work_c','paper_id':'p3','pmid':''},
              ]).to_csv(versions_csv, index=False)
              os.environ.pop('SEMANTIC_SCHOLAR_API_KEY', None)
              os.environ.pop('OPENALEX_API_KEY', None)

              fresh = root / 'enriched_fresh'
              run_main(rescue, ['rescue', '--works-csv', str(works_csv), '--versions-csv', str(versions_csv), '--out', str(fresh)])
              recs = [json.loads(x) for x in (fresh / 'abstract_rescue_progress.jsonl').read_text().splitlines() if x.strip()]
              assert [r['work_id'] for r in recs] == ['work_a', 'work_b', 'work_c']
              assert [r['index'] for r in recs] == [1, 2, 3]
              assert {r['total'] for r in recs} == {3}
              assert [r['rescue_source'] for r in recs] == ['existing', 'still_missing', 'still_missing']
              assert [r['needed_rescue'] for r in recs] == [False, True, True]
              assert recs[0]['abstract_chars'] == len('An existing abstract.')
              assert recs[0]['canonical_paper_id'] == 'p1'
              summary = json.loads((fresh / 'abstract_rescue_summary.json').read_text())
              assert set(summary) == {'works','missing_before','rescued','missing_after','rescue_sources','note'}
              assert (summary['works'], summary['missing_before'], summary['rescued'], summary['missing_after']) == (3, 2, 0, 2)

              resumeable = root / 'enriched_resume'
              resumeable.mkdir()
              (resumeable / 'abstract_rescue_progress.jsonl').write_text(json.dumps({
                  'work_id':'work_b', 'rescue_source':'europe_pmc', 'rescue_identifier':'123456',
                  'abstract':'Rescued abstract text.', 'abstract_chars':22, 'needed_rescue':True,
              }) + '\n')
              run_main(rescue, ['rescue', '--works-csv', str(works_csv), '--versions-csv', str(versions_csv), '--out', str(resumeable)])
              enriched = pd.read_csv(resumeable / 'canonical_works_enriched.csv', dtype={'abstract_rescue_identifier': str})
              row = enriched[enriched.work_id.eq('work_b')].iloc[0]
              assert row.abstract == 'Rescued abstract text.'
              assert row.abstract_rescue_source == 'europe_pmc'
              assert str(row.abstract_rescue_identifier) == '123456'
              resumed = json.loads((resumeable / 'abstract_rescue_summary.json').read_text())
              assert (resumed['missing_before'], resumed['rescued'], resumed['missing_after']) == (2, 1, 1)
              appended = [json.loads(x) for x in (resumeable / 'abstract_rescue_progress.jsonl').read_text().splitlines() if x.strip()]
              last_b = [r for r in appended if r['work_id'] == 'work_b'][-1]
              assert last_b['rescue_source'] == 'europe_pmc' and last_b['attempts'] == ['resume:reused']

          # Review annotation is factored out so partial dumps share the final schema;
          # the deterministic exclusion audit sample must not drift between calls.
          audit = pd.DataFrame([
              {'work_id':f'w{i}', 'source_group':'unresolved', 'decision':'out_of_scope', 'confidence':0.99}
              for i in range(20)
          ])
          first = llm.annotate(audit, 0.85, 0.10, 20260822)
          second = llm.annotate(audit, 0.85, 0.10, 20260822)
          assert list(first.human_review_reason) == list(second.human_review_reason)
          assert int(first.human_review_priority.sum()) == 2
          assert set(first.loc[first.human_review_priority, 'human_review_reason']) == {'random_high_confidence_exclusion_audit'}
          assert 'human_review_priority' not in audit.columns

          # LLM screening streams one record per work. Empty abstracts resolve to
          # insufficient_abstract locally, so no model call is made.
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              enriched_csv = root / 'canonical_works_enriched.csv'
              pd.DataFrame([
                  {'work_id':'w1','canonical_paper_id':'p1','source_group':'core_audit','version_count':1,'member_paper_ids':'p1','title':'One','abstract':'','doi':'','citation_count_work':0},
                  {'work_id':'w2','canonical_paper_id':'p2','source_group':'unresolved','version_count':1,'member_paper_ids':'p2','title':'Two','abstract':'','doi':'','citation_count_work':0},
              ]).to_csv(enriched_csv, index=False)
              out = root / 'llm_screen'
              os.environ['LLM_API_KEY'] = 'unused-because-abstracts-are-empty'
              try:
                  run_main(llm, ['llm', '--works-csv', str(enriched_csv), '--out', str(out)])
              finally:
                  os.environ.pop('LLM_API_KEY', None)
              prog = [json.loads(x) for x in (out / 'llm_screen_progress.jsonl').read_text().splitlines() if x.strip()]
              assert [r['work_id'] for r in prog] == ['w1', 'w2']
              assert [r['index'] for r in prog] == [1, 2]
              assert all(r['total'] == 2 for r in prog)
              assert all(r['decision'] == 'insufficient_abstract' for r in prog)
              assert all(r['cache_hit'] is False for r in prog)
              assert prog[0]['prompt_version'] == llm.PROMPT_VERSION
              assert prog[0]['source_group'] == 'core_audit' and prog[0]['canonical_paper_id'] == 'p1'
              assert {'ts','roles','noise_flags','evidence','reason','confidence','title'} <= set(prog[0])
              results = pd.read_csv(out / 'llm_relevance_results.csv')
              assert list(results.columns)[-2:] == ['human_review_priority', 'human_review_reason']
              assert bool(results.human_review_priority.all())
              screened = json.loads((out / 'llm_relevance_summary.json').read_text())
              assert screened['screened_works'] == 2 and screened['missing_abstracts'] == 2
              assert screened['prompt_version'] == llm.PROMPT_VERSION

          # The viewer classifies either stream, and its summary collapses repeated
          # work IDs to the latest record so resumed runs are not double counted.
          rescue_line = {'index':1, 'total':3, 'work_id':'work_b', 'title':'A paper', 'rescue_source':'europe_pmc', 'rescue_identifier':'123', 'abstract_chars':22, 'needed_rescue':True, 'attempts':['europe_pmc:hit']}
          llm_line = {'index':1, 'total':3, 'work_id':'w1', 'title':'A paper', 'source_group':'unresolved', 'decision':'core_relevant', 'confidence':0.91, 'roles':['reconstruction_segmentation'], 'noise_flags':[], 'cache_hit':True}
          assert watch.kind_of(rescue_line) == 'rescue'
          assert watch.kind_of(llm_line) == 'llm'
          assert 'europe_pmc' in watch.fmt(rescue_line)
          assert 'core_relevant' in watch.fmt(llm_line)
          rescue_summary = watch.summarize([rescue_line, dict(rescue_line, index=2, work_id='work_c', rescue_source='still_missing', abstract_chars=0, attempts=[])])
          assert 'still_missing=1' in rescue_summary
          assert 'rescued so far: 1' in rescue_summary and 'still missing: 1' in rescue_summary
          llm_summary = watch.summarize([llm_line, dict(llm_line, decision='uncertain')])
          assert '1 works seen' in llm_summary and 'uncertain=1' in llm_summary
          assert watch.parse('not json') is None and watch.parse('   ') is None

          # IA-010 record-type triage. Anchoring is the whole safety property: a review
          # ARTICLE and a mid-title "correction" must both survive as research papers.
          records = load('records', Path('analysis/triage_record_types.py'))
          assert records.classify('A survey of connectomics', 'Review;JournalArticle')['record_type'] == 'research_paper'
          assert records.classify('An Error Detection and Correction Framework', 'JournalArticle')['record_type'] == 'research_paper'
          assert records.classify('Review for "The connectome"', 'Review')['record_type'] == 'peer_review_report'
          assert records.classify('Erratum: a mistake', '')['record_type'] == 'erratum_correction'
          # Empty publication_types leaves title evidence standing alone, one level lower.
          assert records.classify('Erratum: a mistake', 'JournalArticle')['confidence'] == 'high'
          assert records.classify('Erratum: a mistake', '')['confidence'] == 'medium'
          # A contradicted publication-type signal keeps the work in the paper denominator.
          vetoed = records.classify('What do the mushroom bodies do?', 'Editorial;Review;JournalArticle')
          assert vetoed['record_type'] == 'research_paper' and vetoed['review_queue']

          print('analysis helper checks passed')
          PY
