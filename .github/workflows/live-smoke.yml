name: Semantic Scholar live smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-scholar-smoke:
    runs-on: ubuntu-latest
    env:
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Semantic Scholar secret
        run: |
          if [ -z "$SEMANTIC_SCHOLAR_API_KEY" ]; then
            echo "Repository secret SEMANTIC_SCHOLAR_API_KEY is not configured." >&2
            exit 2
          fi

      - name: Reconstruct verified source bundle
        run: bash bootstrap_bundle.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: connectomics_deterministic_pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run offline tests first
        working-directory: connectomics_deterministic_pipeline
        run: python -m pytest -q

      - name: Run endpoint-by-endpoint Semantic Scholar smoke test
        working-directory: connectomics_deterministic_pipeline
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import requests

          from connectomics_pipeline.client import SemanticScholarClient

          BASE = 'https://api.semanticscholar.org/graph/v1'
          KEY = os.environ['SEMANTIC_SCHOLAR_API_KEY'].strip()
          HEADERS = {'x-api-key': KEY}
          results = []

          def direct_get(label, path, params):
              r = requests.get(BASE + path, params=params, headers=HEADERS, timeout=90)
              results.append({'stage': label, 'status_code': r.status_code})
              print(f'{label}: HTTP {r.status_code}')
              if r.status_code >= 400:
                  raise SystemExit(f'{label} failed: HTTP {r.status_code}: {r.text[:500]}')
              time.sleep(1.3)
              return r.json()

          # 1. Minimal authenticated request: isolates key/header problems.
          auth = direct_get(
              'authenticated_relevance_search',
              '/paper/search',
              {'query': 'connectomics', 'limit': 1, 'fields': 'title'},
          )
          if not auth.get('data'):
              raise SystemExit('authenticated_relevance_search returned zero records')

          # 2. Minimal current bulk-search field contract.
          bulk_min = direct_get(
              'bulk_search_minimal_current_fields',
              '/paper/search/bulk',
              {'query': 'synaptic connectomics', 'fields': 'title,s2FieldsOfStudy'},
          )
          if not bulk_min.get('data'):
              raise SystemExit('bulk_search_minimal_current_fields returned zero records')

          # 3. Exercise the adapter's full paper field contract.
          client = SemanticScholarClient(
              cache_dir='.cache/s2-smoke',
              min_interval_seconds=1.2,
              timeout_seconds=90,
          )
          rows, meta = next(client.bulk_search('synaptic connectomics', max_pages=1))
          results.append({
              'stage': 'adapter_bulk_search_full_fields',
              'status_code': meta.get('status_code', 200),
              'n_records': len(rows),
              'request_fingerprint': meta.get('request_fingerprint'),
              'cached': meta.get('cached'),
          })
          if not rows:
              raise SystemExit('adapter_bulk_search_full_fields returned zero records')

          first = rows[0]
          paper_id = first.get('paperId')
          title = first.get('title') or ''
          if not paper_id:
              raise SystemExit('adapter bulk result missing paperId')

          # 4. Full-field paper lookup.
          paper, pmeta = client.paper(paper_id)
          results.append({'stage': 'paper_lookup_full_fields', 'status_code': pmeta.get('status_code', 200)})
          if paper.get('paperId') != paper_id:
              raise SystemExit('paper_lookup_full_fields returned wrong paperId')

          # 5. Title-match endpoint uses the same paper field contract.
          if title:
              match, mmeta = client.title_match(title)
              results.append({'stage': 'title_match_full_fields', 'status_code': mmeta.get('status_code', 200)})
              if not match.get('paperId'):
                  raise SystemExit('title_match_full_fields returned no paperId')

          # 6. Citation-edge contract: request edge fields + nested paper fields.
          citation_rows, cmeta = next(client.citation_neighbors(paper_id, 'citations', max_pages=1, limit=1))
          results.append({
              'stage': 'citations_edge_and_paper_fields',
              'status_code': cmeta.get('status_code', 200),
              'n_records': len(citation_rows),
          })

          # 7. Reference endpoint has the same edge contract.
          reference_rows, rmeta = next(client.citation_neighbors(paper_id, 'references', max_pages=1, limit=1))
          results.append({
              'stage': 'references_edge_and_paper_fields',
              'status_code': rmeta.get('status_code', 200),
              'n_records': len(reference_rows),
          })

          # 8. Author-papers endpoint uses the paper field contract.
          authors = first.get('authors') or []
          author_id = next((a.get('authorId') for a in authors if a.get('authorId')), None)
          if author_id:
              author_rows, ameta = next(client.author_papers(author_id, max_papers=1))
              results.append({
                  'stage': 'author_papers_full_fields',
                  'status_code': ameta.get('status_code', 200),
                  'n_records': len(author_rows),
              })

          safe = {
              'ok': True,
              'paper_fields': client.paper_fields.split(','),
              'citation_edge_fields': client.citation_edge_fields.split(','),
              'stages': results,
              'first_title': title,
          }
          print(json.dumps(safe, indent=2))
          with open('s2_smoke_result.json', 'w', encoding='utf-8') as f:
              json.dump(safe, f, indent=2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-scholar-smoke-result
          path: connectomics_deterministic_pipeline/s2_smoke_result.json
          if-no-files-found: warn
