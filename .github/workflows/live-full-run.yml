name: Full deterministic connectomics run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'fresh'
        type: choice
        options:
          - fresh
          - seed_expand

permissions:
  contents: read

jobs:
  full-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Require Semantic Scholar secret
        run: |
          if [ -z "$SEMANTIC_SCHOLAR_API_KEY" ]; then
            echo "Repository secret SEMANTIC_SCHOLAR_API_KEY is not configured." >&2
            exit 2
          fi

      - name: Reconstruct verified source bundle
        run: bash bootstrap_bundle.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: connectomics_deterministic_pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run offline tests first
        working-directory: connectomics_deterministic_pipeline
        run: python -m pytest -q

      - name: Prepare run configuration
        working-directory: connectomics_deterministic_pipeline
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          mode = os.environ['REQUESTED_MODE']
          src = pathlib.Path('config.example.yaml' if mode == 'fresh' else 'config.seed-expand.yaml')
          cfg = yaml.safe_load(src.read_text())
          cfg['mode'] = mode
          cfg['outdir'] = 'outputs'
          pathlib.Path('config.ci.yaml').write_text(yaml.safe_dump(cfg, sort_keys=False))
          print(f'Prepared config.ci.yaml for mode={mode}', flush=True)
          PY

      - name: Execute deterministic pipeline with live status
        working-directory: connectomics_deterministic_pipeline
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$GITHUB_WORKSPACE/run_observability"
          mkdir -p "$LOG_DIR"
          START_TS=$(date +%s)

          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] launching fresh deterministic pipeline" | tee "$LOG_DIR/driver.log"
          ( python run_pipeline.py --config config.ci.yaml 2>&1 | tee "$LOG_DIR/full_run_stdout.log" ) &
          PIPE_PID=$!
          echo "$PIPE_PID" > "$LOG_DIR/pipeline.pid"

          while kill -0 "$PIPE_PID" 2>/dev/null; do
            NOW_TS=$(date +%s)
            ELAPSED=$((NOW_TS - START_TS))
            HH=$((ELAPSED/3600))
            MM=$(((ELAPSED%3600)/60))
            SS=$((ELAPSED%60))
            CACHE_JSON=$(find outputs -type f -path '*cache*' -name '*.json' 2>/dev/null | wc -l | tr -d ' ' || true)
            OUT_COUNT=$(find outputs -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ' || true)
            OUT_BYTES=$(du -sb outputs 2>/dev/null | awk '{print $1}' || echo 0)
            LAST_LINE=$(tail -n 1 "$LOG_DIR/full_run_stdout.log" 2>/dev/null || true)
            printf '[%s] HEARTBEAT elapsed=%02d:%02d:%02d cached_responses=%s output_files=%s output_bytes=%s last=%q\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$HH" "$MM" "$SS" "$CACHE_JSON" "$OUT_COUNT" "$OUT_BYTES" "${LAST_LINE:0:240}" \
              | tee -a "$LOG_DIR/driver.log"
            sleep 60
          done

          wait "$PIPE_PID"

      - name: Publish runtime summary
        if: always()
        shell: bash
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/run_observability"
          {
            echo "### Deterministic connectomics run status"
            echo
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Workflow run: \`${{ github.run_id }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo
            if [ -f "$LOG_DIR/driver.log" ]; then
              echo "#### Last heartbeat/status lines"
              echo '```text'
              tail -n 20 "$LOG_DIR/driver.log"
              echo '```'
            fi
            if [ -f "$LOG_DIR/full_run_stdout.log" ]; then
              echo "#### Last pipeline lines"
              echo '```text'
              tail -n 30 "$LOG_DIR/full_run_stdout.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify manifest exists
        if: success()
        working-directory: connectomics_deterministic_pipeline
        run: |
          test -s outputs/manifest.json
          python - <<'PY'
          import json
          m=json.load(open('outputs/manifest.json'))
          print(json.dumps(m.get('counts',{}), indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectomics-${{ inputs.mode }}-outputs
          path: |
            connectomics_deterministic_pipeline/outputs/**
            connectomics_deterministic_pipeline/config.ci.yaml
            run_observability/**
          if-no-files-found: warn
          retention-days: 30
